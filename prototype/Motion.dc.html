<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Motion engine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span hidden data-motion-engine></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":40}}'>
class Component extends DCLogic {
  componentDidMount() {
    try { this.boot(); } catch (e) { console.warn('motion', e); }
  }
  renderVals() { return {}; }
  /* Scroll motion for every page, on GSAP 3.12.5 + ScrollTrigger + Lenis 1.1.13 (vendor/, same files as
     assets/vendor). Reads the data-* hooks from the live site (data-split, data-clip, data-par, data-stagger,
     data-tone, data-cursor, data-motion="…"). It starts only when the artboard scrolls as a real page
     (browser, Play or full window); the static canvas, reduced motion, or a failed script keep the
     final, fully visible layout. Pins use CSS sticky inside a section whose height is set here,
     so no wrapper elements are added to the component tree. */
  /* Menu as on the live site: the burger opens Menu.dc.html as a full-screen layer that spreads out
     in a circle from the button (clip-path circle, .8s), and shrinks back into it on close.
     Without this (script error, menu not loaded in time) the burger is a plain link to the menu page. */
  menuOverlay(W, D, reduce, overlay) {
    if (overlay) {
      /* inside the layer: close and Esc go back to the page, other links open in the page */
      const close = () => W.parent.postMessage('ss-menu-close', '*');
      D.addEventListener('click', (e) => {
        const a = e.target.closest && e.target.closest('a[href]');
        if (!a) return;
        e.preventDefault();
        if (a.classList.contains('close')) close(); else W.parent.location.href = a.href;
      }, true);
      D.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      return;
    }
    if (W.__ssMenu) return;
    const st = W.__ssMenu = { frame: null, ready: false, open: false, btn: null };
    const dur = reduce ? 0 : 800, ease = 'cubic-bezier(.22,.7,.18,1)';
    const origin = () => {
      const r = st.btn && st.btn.getBoundingClientRect();
      return r && r.width ? `${Math.round(r.left + r.width / 2)}px ${Math.round(r.top + r.height / 2)}px` : `calc(100% - 2.875rem) 2.625rem`;
    };
    const build = (href) => {
      if (st.frame) return st.frame;
      const f = st.frame = D.createElement('iframe');
      f.title = 'Menu';
      f.setAttribute('aria-hidden', 'true');
      f.tabIndex = -1;
      f.style.cssText = `position:fixed;inset:0;width:100%;height:100%;border:0;z-index:9999;background:#1f3552;visibility:hidden;clip-path:circle(0px at ${origin()});transition:clip-path ${dur}ms ${ease},visibility 0s ${dur}ms`;
      f.addEventListener('load', () => { st.ready = true; });
      f.src = href + (href.includes('?') ? '&' : '?') + 'overlay=1';
      D.body.appendChild(f);
      return f;
    };
    const setOpen = (o) => {
      const f = st.frame;
      if (!f || o === st.open) return;
      st.open = o;
      const at = origin(), m = W.__ssMotion || {};
      if (o) {
        f.style.transition = 'none';
        f.style.clipPath = `circle(0px at ${at})`;
        void f.offsetWidth;
        f.style.transition = `clip-path ${dur}ms ${ease}`;
        f.style.visibility = 'visible';
        f.style.clipPath = `circle(150vmax at ${at})`;
        f.removeAttribute('aria-hidden');
        f.tabIndex = 0;
        if (m.lenis) m.lenis.stop();
        D.documentElement.style.overflow = 'hidden';
        try { const cm = f.contentWindow.__ssMotion; if (cm && cm.menuIn) cm.menuIn(); } catch (e) {}
        setTimeout(() => { try { f.focus(); } catch (e) {} }, 50);
      } else {
        f.style.transition = `clip-path ${dur}ms ${ease},visibility 0s ${dur}ms`;
        f.style.clipPath = `circle(0px at ${at})`;
        f.style.visibility = 'hidden';
        f.setAttribute('aria-hidden', 'true');
        f.tabIndex = -1;
        if (m.lenis) m.lenis.start();
        D.documentElement.style.overflow = '';
        if (st.btn) st.btn.focus();
      }
    };
    const warm = (e) => {
      const b = e.target.closest && e.target.closest('a.burger[href]');
      if (b) { st.btn = b; build(b.getAttribute('href')); }
    };
    D.addEventListener('pointerover', warm);
    D.addEventListener('focusin', warm);
    D.addEventListener('click', (e) => {
      const b = e.target.closest && e.target.closest('a.burger[href]');
      if (!b || e.metaKey || e.ctrlKey || e.shiftKey) return;
      st.btn = b;
      const f = build(b.getAttribute('href'));
      e.preventDefault();
      if (st.ready) { setOpen(true); return; }
      /* not loaded yet: open as soon as it is, or fall back to a normal page load */
      const t = setTimeout(() => { W.location.href = b.href; }, 2500);
      f.addEventListener('load', () => { clearTimeout(t); setOpen(true); }, { once: true });
    }, true);
    W.addEventListener('message', (e) => { if (e.data === 'ss-menu-close' && st.frame && e.source === st.frame.contentWindow) setOpen(false); });
    W.addEventListener('keydown', (e) => { if (e.key === 'Escape' && st.open) setOpen(false); });
  }
  boot() {
    const W = window, D = document;
    if (W.__ssMotion) { W.__ssMotion.scan && W.__ssMotion.scan(); return; }
    const api = W.__ssMotion = {};
    const reduce = W.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const overlay = /[?&]overlay=1/.test(W.location.search);
    try { this.menuOverlay(W, D, reduce, overlay); } catch (e) { console.warn('menu', e); }
    if (reduce) return;
    const fine = W.matchMedia('(hover: hover) and (pointer: fine)').matches;
    const isLive = () => W.innerHeight <= 1600 && W.innerHeight <= Math.max(W.screen.height || 0, 1000) + 40 && D.documentElement.scrollHeight > W.innerHeight + 40;
    const sup = D.querySelector('script[src*="support.js"]');
    const base = sup ? sup.src.replace(/support\.js.*$/, '') : '';
    const load = (src) => new Promise((ok, bad) => {
      const s = D.createElement('script');
      s.src = base + src; s.async = false; s.onload = ok; s.onerror = bad;
      D.head.appendChild(s);
    });
    let started = false;
    const tryStart = () => {
      if (started || !isLive()) return;
      started = true;
      const need = [];
      if (!W.gsap) need.push('vendor/gsap.min.js');
      if (!W.ScrollTrigger) need.push('vendor/ScrollTrigger.min.js');
      if (!W.Lenis) need.push('vendor/lenis.min.js');
      Promise.all(need.map(load)).then(() => { try { init(); } catch (e) { console.warn('motion', e); } }).catch(() => {});
    };
    setTimeout(tryStart, 300);
    W.addEventListener('resize', tryStart);

    const init = () => {
      const gsap = W.gsap, ST = W.ScrollTrigger;
      if (!gsap || !ST) return;
      gsap.registerPlugin(ST);
      ST.config({ ignoreMobileResize: true });
      const vh = () => W.innerHeight;

      /* ---------- smooth scroll ---------- */
      let lenis = null;
      if (W.Lenis) {
        lenis = new W.Lenis({ lerp: 0.09, wheelMultiplier: 1, smoothWheel: true });
        lenis.on('scroll', ST.update);
        gsap.ticker.add((t) => lenis.raf(t * 1000));
        gsap.ticker.lagSmoothing(0);
      }
      api.lenis = lenis;
      D.addEventListener('click', (e) => {
        const a = e.target.closest && e.target.closest('a[href^="#"]');
        if (!a) return;
        const id = a.getAttribute('href').slice(1), el = id ? D.getElementById(id) : null;
        if (!el && id !== 'top') return;
        e.preventDefault();
        if (lenis) lenis.scrollTo(el || 0, { offset: el ? -96 : 0, duration: 1.4, easing: (t) => 1 - Math.pow(1 - t, 4) });
        else W.scrollTo({ top: el ? el.getBoundingClientRect().top + W.scrollY - 96 : 0, behavior: 'smooth' });
      });

      /* ---------- helpers ---------- */
      const once = (el, key) => { if (el['__ss' + key]) return false; el['__ss' + key] = 1; return true; };
      /* words, optionally wrapped in a mask (.wm) so they rise out of their line */
      const splitWords = (el, mask) => {
        if (el.__ssWords) return el.__ssWords;
        const words = [];
        const walk = (node) => {
          [...node.childNodes].forEach((n) => {
            if (n.nodeType === 3 && n.textContent.trim()) {
              const frag = D.createDocumentFragment();
              n.textContent.split(/(\s+)/).forEach((part) => {
                if (!part) return;
                if (/^\s+$/.test(part)) { frag.appendChild(D.createTextNode(part)); return; }
                const w = D.createElement('span');
                w.className = 'w';
                w.style.display = 'inline-block';
                w.textContent = part;
                if (mask) {
                  const m = D.createElement('span');
                  m.className = 'wm';
                  m.style.cssText = 'display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em';
                  m.appendChild(w);
                  frag.appendChild(m);
                } else frag.appendChild(w);
                words.push(w);
              });
              n.replaceWith(frag);
            } else if (n.nodeType === 1 && !n.classList.contains('w') && !n.classList.contains('wm')) walk(n);
          });
        };
        walk(el);
        el.__ssWords = words;
        return words;
      };
      /* GSAP and a CSS transition on the same property fight: a refresh can read a half-finished
         transition as the end value and leave cards stuck part-way. Turn CSS transitions off while
         GSAP owns the element; the end state then clears them back to the stylesheet. */
      const noTrans = (els) => els.forEach((e) => { e.style.transition = 'none'; });
      const refresh = (() => { let t = null; return () => { clearTimeout(t); t = setTimeout(() => ST.refresh(), 150); }; })();

      /* ---------- header: frosted pill after the hero, hides while scrolling down ---------- */
      const heads = [];
      let lastY = 0;
      const onScroll = (y) => {
        const down = y > lastY + 4, up = y < lastY - 4;
        heads.forEach((o) => {
          let hide = o.hide;
          if (y > vh() * 0.9 && down) hide = true;
          if (up || y < 200) hide = false;
          if (hide !== o.hide) { o.hide = hide; gsap.to(o.h, { yPercent: hide ? -115 : 0, duration: 0.6, ease: 'power3.out', overwrite: true }); }
          const sc = y > 60;
          if (o.photo && o.bar && sc !== o.sc) { o.sc = sc; o.bar.classList.toggle('is-scrolled', sc); }
        });
        if (down || up) lastY = y;
      };
      if (lenis) lenis.on('scroll', (l) => onScroll(l.scroll)); else W.addEventListener('scroll', () => onScroll(W.scrollY), { passive: true });

      /* ---------- custom cursor (mouse only) ---------- */
      let cursor = null, label = null;
      if (fine) {
        cursor = D.createElement('div');
        cursor.setAttribute('aria-hidden', 'true');
        cursor.style.cssText = 'position:fixed;left:0;top:0;z-index:90;pointer-events:none;will-change:transform';
        label = D.createElement('span');
        label.style.cssText = 'display:grid;place-items:center;width:5.5rem;height:5.5rem;margin:-2.75rem 0 0 -2.75rem;border-radius:50%;background:var(--navy);color:#fff;font:600 .8rem/1 var(--font-body);letter-spacing:.06em;transform:scale(0)';
        cursor.appendChild(label);
        D.body.appendChild(cursor);
        const cx = gsap.quickTo(cursor, 'x', { duration: 0.45, ease: 'power3' }), cy = gsap.quickTo(cursor, 'y', { duration: 0.45, ease: 'power3' });
        W.addEventListener('pointermove', (e) => { cx(e.clientX); cy(e.clientY); }, { passive: true });
      }

      /* ---------- the effects, wired once per element (parts mount late, so this re-runs) ---------- */
      let toneRoot = null;
      const scan = () => {
        /* header */
        D.querySelectorAll('[data-motion="bar-hide-on-scroll"]').forEach((h) => {
          if (!once(h, 'head')) return;
          const bar = h.querySelector('.bar-in');
          if (!h.closest('.top') && !h.closest('.bar-top')) { h.style.position = 'sticky'; h.style.top = '0'; h.style.zIndex = '40'; }
          heads.push({ h, bar, hide: false, sc: null, photo: !!(bar && !bar.classList.contains('is-scrolled')) });
          gsap.from(h, { yPercent: -100, opacity: 0.25, duration: 1, ease: 'power3.out', delay: 0.15 });
        });

        /* hero: photo eases in, then shrinks into a rounded card while the text drifts up */
        D.querySelectorAll('[data-motion="hero-card"]').forEach((hero) => {
          if (!once(hero, 'hero')) return;
          const media = hero.querySelector('.hmedia'), img = media && media.querySelector('img'), inner = hero.querySelector('.in');
          if (img) gsap.fromTo(img, { scale: 1.18 }, { scale: 1.04, duration: 2.2, ease: 'power3.out' });
          const tl = gsap.timeline({ scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: true } });
          if (media) tl.fromTo(media, { clipPath: 'inset(0% 0% 0% 0% round 0px)' }, { clipPath: 'inset(4% 3% 0% 3% round 32px)', ease: 'none' }, 0);
          if (img) tl.to(img, { yPercent: 14, ease: 'none' }, 0);
          if (inner) tl.to(inner, { yPercent: -22, opacity: 0.2, ease: 'none' }, 0);
        });

        /* page tone: sections go transparent so the colour behind them can shift */
        D.querySelectorAll('[data-tone]').forEach((sec) => {
          if (!once(sec, 'tone')) return;
          if (!toneRoot) toneRoot = sec.parentElement;
          sec.style.background = 'transparent';
          ST.create({ trigger: sec, start: 'top 55%', end: 'bottom 55%', onToggle: (s) => { if (s.isActive && toneRoot) gsap.to(toneRoot, { backgroundColor: sec.dataset.tone, duration: 0.8, ease: 'power2.out', overwrite: true }); } });
        });

        /* headings: words rise out of a mask */
        D.querySelectorAll('[data-split]').forEach((h) => {
          if (!once(h, 'split')) return;
          const ws = splitWords(h, true);
          gsap.from(ws, { yPercent: 90, opacity: 0.25, duration: 0.9, ease: 'expo.out', stagger: 0.04, scrollTrigger: { trigger: h, start: 'top 90%', once: true } });
        });
        /* section intro lines next to the heading */
        D.querySelectorAll('.head > .eyebrow, .head > p').forEach((el) => {
          if (!once(el, 'fade')) return;
          gsap.fromTo(el, { y: 40, opacity: 0.25 }, { y: 0, opacity: 1, duration: 0.9, ease: 'expo.out', delay: el.matches('p') ? 0.12 : 0, scrollTrigger: { trigger: el, start: 'top 92%', once: true } });
        });

        /* statement: words fill in as you scroll */
        D.querySelectorAll('[data-motion="fill-words"]').forEach((st) => {
          if (!once(st, 'fill')) return;
          const ws = splitWords(st, false);
          gsap.fromTo(ws, { color: 'rgba(31,53,82,.18)' }, { color: 'rgba(31,53,82,1)', ease: 'none', stagger: 0.1, scrollTrigger: { trigger: st, start: 'top 80%', end: 'bottom 40%', scrub: true } });
        });

        /* large images open from an inset rounded rectangle, the photo settles inside */
        D.querySelectorAll('[data-clip]').forEach((el) => {
          if (!once(el, 'clip')) return;
          const tl = gsap.timeline({ scrollTrigger: { trigger: el, start: 'top 95%', end: 'top 30%', scrub: true } });
          tl.fromTo(el, { clipPath: 'inset(12% 10% 12% 10% round 36px)' }, { clipPath: 'inset(0% 0% 0% 0% round 18px)', ease: 'none' }, 0);
          const im = el.querySelector('img:not([data-par])');
          if (im) tl.fromTo(im, { scale: 1.25 }, { scale: 1, ease: 'none' }, 0);
        });

        /* inner parallax */
        D.querySelectorAll('[data-par]').forEach((img) => {
          if (img.closest('[data-motion="pin-horizontal"]') || !once(img, 'par')) return;
          const a = +img.dataset.par || 6;
          gsap.fromTo(img, { yPercent: -a }, { yPercent: a, ease: 'none', scrollTrigger: { trigger: img.parentElement, start: 'top bottom', end: 'bottom top', scrub: true } });
        });

        /* grids: children rise in turn */
        D.querySelectorAll('[data-stagger]').forEach((g) => {
          if (!once(g, 'stagger')) return;
          /* cards in the same row rise together, rows follow each other, so a row never looks stepped */
          const kids = [...g.children], tops = [...new Set(kids.map((k) => k.offsetTop))];
          noTrans(kids);
          gsap.fromTo(kids, { y: 40, opacity: 0.25 }, { y: 0, opacity: 1, duration: 0.8, ease: 'expo.out', onComplete: () => gsap.set(kids, { clearProps: 'transition,transform,opacity' }), delay: (i) => tops.indexOf(kids[i].offsetTop) * 0.08, scrollTrigger: { trigger: g, start: 'top 90%', once: true } });
        });

        /* content blocks: everything else in a section rises into place once, in reading order.
           Blocks already on screen when motion starts are left alone, so nothing jumps. */
        const rise = [];
        const skip = '.head, [data-split], [data-stagger], [data-clip], [data-motion], script, style';
        D.querySelectorAll('.sec .wrap > *, section.blk:not(.walk) > *, section.ask > *, section.form > *, section.sim > *').forEach((el) => {
          if (!once(el, 'rise') || el.matches(skip) || el.querySelector('[data-split], [data-stagger], [data-clip]')) return;
          if (el.getBoundingClientRect().top < W.innerHeight * 0.92) return;
          noTrans([el]);
          gsap.set(el, { y: 80, opacity: 0.25 });
          rise.push(el);
        });
        if (rise.length) ST.batch(rise, { start: 'top 92%', once: true, onEnter: (b) => gsap.to(b, { y: 0, opacity: 1, duration: 0.9, ease: 'expo.out', stagger: 0.08, overwrite: true, onComplete: () => gsap.set(b, { clearProps: 'transition,transform,opacity' }) }) });

        /* marquee: speed and skew follow scroll velocity */
        D.querySelectorAll('[data-motion="marquee-velocity"]').forEach((m) => {
          if (!once(m, 'marq')) return;
          const row = m.firstElementChild;
          if (!row) return;
          [...row.children].forEach((c) => row.appendChild(c.cloneNode(true)));
          row.style.willChange = 'transform';
          let x = 0, half = 0, dir = 1, vis = true, skew = 0;
          const measure = () => { half = (row.scrollWidth + (parseFloat(getComputedStyle(row).columnGap) || 0)) / 2; };
          measure();
          ST.addEventListener('refresh', measure);
          ST.create({ trigger: m, start: 'top bottom', end: 'bottom top', onToggle: (s) => { vis = s.isActive; } });
          gsap.ticker.add((t, dt) => {
            if (!vis || !half) return;
            const v = lenis ? lenis.velocity : 0;
            if (Math.abs(v) > 0.3) dir = v > 0 ? 1 : -1;
            x -= (0.8 + Math.min(Math.abs(v), 60) * 0.35) * dir * (dt / 16.67);
            if (x < -half) x += half;
            if (x > 0) x -= half;
            skew += (Math.max(-8, Math.min(8, -v * 0.3)) - skew) * 0.12;
            row.style.transform = `translate3d(${x}px,0,0) skewX(${skew.toFixed(2)}deg)`;
          });
        });

        /* stacking cards: earlier cards sink back and darken as the next one arrives */
        D.querySelectorAll('[data-motion="stack-cards"]').forEach((wrap) => {
          if (!once(wrap, 'stack')) return;
          const cards = [...wrap.children];
          cards.forEach((c, i) => {
            const im = c.querySelector('img');
            if (im) gsap.fromTo(im, { scale: 1.2 }, { scale: 1, ease: 'none', scrollTrigger: { trigger: c, start: 'top bottom', end: 'top 20%', scrub: true } });
            if (i === cards.length - 1) return;
            const next = cards[i + 1], shade = c.querySelector('.shade');
            const tl = gsap.timeline({ scrollTrigger: { trigger: next, start: 'top bottom', end: 'top 15%', scrub: true } });
            tl.to(c, { scale: 0.9, ease: 'none' }, 0);
            if (shade) tl.to(shade, { opacity: 0.5, ease: 'none' }, 0);
          });
        });

        /* home: walk through the house, one pinned room after another */
        D.querySelectorAll('[data-motion="walk"]').forEach((sec) => {
          if (!once(sec, 'walk')) return;
          const stage = sec.querySelector('.walk-stage'), slides = [...sec.querySelectorAll('.walk-slide')], caps = [...sec.querySelectorAll('.walk-cap')];
          const steps = [...sec.querySelectorAll('.walk-steps li')], bar = sec.querySelector('.walk-bar b'), count = sec.querySelector('.walk-count');
          const n = slides.length;
          if (!stage || n < 2) return;
          const size = () => { sec.style.height = (n * 100) + 'vh'; };
          size();
          stage.style.position = 'sticky';
          stage.style.top = '0';
          stage.style.height = '100vh';
          caps.forEach((c, i) => { if (i) gsap.set(c, { yPercent: 40, opacity: 0 }); });
          const tl = gsap.timeline({ defaults: { ease: 'none' } });
          for (let i = 1; i < n; i++) {
            const at = i - 1, prev = slides[i - 1].querySelector('img'), nx = slides[i], nxi = nx.querySelector('img');
            /* wipe up: the slide moves up while its photo moves down by the same amount (transforms only, GPU friendly) */
            gsap.set(nx, { y: 0, yPercent: 100 });
            if (nxi) gsap.set(nxi, { yPercent: -100, scale: 1.3 });
            tl.to(nx, { yPercent: 0, duration: 1 }, at);
            if (nxi) tl.to(nxi, { yPercent: 0, scale: 1.05, duration: 1 }, at);
            if (prev) tl.to(prev, { scale: 1.15, yPercent: -6, duration: 1 }, at);
            if (caps[i - 1]) tl.to(caps[i - 1], { yPercent: -40, opacity: 0, duration: 0.4 }, at + 0.1);
            if (caps[i]) tl.to(caps[i], { yPercent: 0, opacity: 1, duration: 0.45 }, at + 0.5);
          }
          /* data-walk="step": each step plays through on its own once you scroll past a third of it,
             instead of following the scroll speed */
          const step = sec.dataset.walk === 'step';
          if (step) tl.pause(0);
          let cur = -1;
          ST.create({
            trigger: sec, start: 'top top', end: 'bottom bottom', scrub: step ? false : 0.8, animation: step ? null : tl,
            onUpdate: (s) => {
              const k = Math.min(n - 1, step ? Math.floor(s.progress * (n - 1) + 0.66) : Math.round(s.progress * (n - 1)));
              if (bar) bar.style.transform = `scaleX(${step ? (k + 1) / n : s.progress})`;
              if (k !== cur) {
                cur = k;
                if (step) gsap.to(tl, { time: k, duration: 0.85, ease: 'power4.inOut', overwrite: true });
                steps.forEach((li, j) => li.classList.toggle('on', j === k));
                if (count && count.firstChild) count.firstChild.nodeValue = String(k + 1).padStart(2, '0') + ' / ' + String(n).padStart(2, '0');
              }
            }
          });
          ST.addEventListener('refreshInit', size);
        });

        /* detail: sticky photo grid, columns slide in opposite ways, then the grid zooms to the centre photo */
        D.querySelectorAll('[data-motion="sticky-grid"]').forEach((sec) => {
          if (!once(sec, 'grid')) return;
          const stage = sec.querySelector('.sg-stage'), grid = sec.querySelector('.sg-grid'), cols = [...sec.querySelectorAll('.sg-col')], text = sec.querySelector('.sg-text');
          if (!stage || !grid || cols.length < 3) return;
          const size = () => { sec.style.height = '320vh'; };
          size();
          stage.style.position = 'sticky';
          stage.style.top = '0';
          stage.style.height = '100vh';
          const tl = gsap.timeline({ defaults: { ease: 'none' } });
          cols.forEach((c, i) => { gsap.set(c, { yPercent: i % 2 ? -30 : 30 }); tl.to(c, { yPercent: 0, duration: 1 }, 0); });
          const mid = cols[1].children[1] || cols[1].firstElementChild;
          const zoom = () => (mid ? Math.max(W.innerWidth / mid.offsetWidth, W.innerHeight / mid.offsetHeight) * 1.04 : 2.4);
          tl.to(grid, { scale: zoom, duration: 1.2, ease: 'power1.inOut' }, 1);
          tl.to(cols[0], { xPercent: -50, duration: 1.2, ease: 'power1.inOut' }, 1);
          tl.to(cols[cols.length - 1], { xPercent: 50, duration: 1.2, ease: 'power1.inOut' }, 1);
          if (text) { gsap.set(text, { autoAlpha: 0, y: 40 }); tl.to(text, { autoAlpha: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 1.9); }
          ST.create({ trigger: sec, start: 'top top', end: 'bottom bottom', scrub: 1, animation: tl, invalidateOnRefresh: true });
          ST.addEventListener('refreshInit', size);
        });

        /* detail: rooms pinned and moved sideways (desktop), swipe with a progress bar (phones) */
        D.querySelectorAll('[data-motion="pin-horizontal"]').forEach((sec) => {
          if (!once(sec, 'pin')) return;
          const pin = sec.querySelector('.pin-in'), row = sec.querySelector('.rooms'), bar = sec.querySelector('.pprog b'), cnt = sec.querySelector('.pprog .pc');
          if (!pin || !row) return;
          const n = row.children.length;
          const prog = (p) => {
            if (bar) bar.style.transform = `scaleX(${p})`;
            if (cnt && cnt.firstChild) cnt.firstChild.nodeValue = String(Math.min(n, Math.floor(p * (n - 0.01)) + 1)).padStart(2, '0') + ' / ' + String(n).padStart(2, '0');
          };
          const mm = gsap.matchMedia();
          mm.add('(min-width: 761px)', () => {
            row.style.scrollSnapType = 'none';
            row.style.overflow = 'visible';
            pin.style.overflow = 'hidden';
            pin.style.position = 'sticky';
            let dist = 0, stick = 96;
            const size = () => {
              gsap.set(row, { x: 0 });
              dist = Math.max(0, row.scrollWidth - pin.clientWidth);
              const ph = pin.offsetHeight;
              stick = Math.max(96, (vh() - ph) / 2);
              pin.style.top = stick + 'px';
              sec.style.height = (ph + dist) + 'px';
            };
            size();
            ST.addEventListener('refreshInit', size);
            const tw = gsap.to(row, { x: () => -dist, ease: 'none', scrollTrigger: { trigger: sec, start: () => 'top ' + stick, end: () => '+=' + dist, scrub: 0.8, invalidateOnRefresh: true, onUpdate: (s) => prog(s.progress) } });
            row.querySelectorAll('.room img').forEach((im) => gsap.fromTo(im, { xPercent: -6, scale: 1.12 }, { xPercent: 6, scale: 1.12, ease: 'none', scrollTrigger: { trigger: im.parentElement, containerAnimation: tw, start: 'left right', end: 'right left', scrub: true } }));
            return () => {
              ST.removeEventListener('refreshInit', size);
              row.style.scrollSnapType = ''; row.style.overflow = ''; pin.style.overflow = ''; pin.style.position = ''; pin.style.top = ''; sec.style.height = '';
              gsap.set(row, { clearProps: 'transform' }); prog(0);
            };
          });
          mm.add('(max-width: 760px)', () => {
            const on = () => prog(row.scrollLeft / Math.max(1, row.scrollWidth - row.clientWidth));
            row.addEventListener('scroll', on, { passive: true });
            on();
            return () => row.removeEventListener('scroll', on);
          });
        });

        /* footer: big line rises, columns follow */
        D.querySelectorAll('[data-motion="footer-image-rise"]').forEach((f) => {
          if (!once(f, 'foot')) return;
          const big = f.querySelector('.big');
          if (big) gsap.from(splitWords(big, true), { yPercent: 80, opacity: 0.25, duration: 1.2, ease: 'expo.out', stagger: 0.06, scrollTrigger: { trigger: big, start: 'top 92%', once: true } });
          gsap.fromTo(f.querySelectorAll('.fcols > div, .fbot'), { y: 50, opacity: 0.25 }, { y: 0, opacity: 1, duration: 1, ease: 'power3.out', stagger: 0.08, scrollTrigger: { trigger: f, start: 'top 80%', once: true } });
        });

        /* menu: wordmark, links and clocks come in on open */
        D.querySelectorAll('[data-motion="menu-open"]').forEach((mn) => {
          if (!once(mn, 'menu')) return;
          const tl = gsap.timeline({ defaults: { ease: 'expo.out' } });
          api.menuIn = () => tl.restart();
          tl.from(mn.querySelectorAll('.word > *'), { yPercent: 60, opacity: 0.25, duration: 1.2, stagger: 0.08 })
            .from(mn.querySelectorAll('.mnav a'), { y: 40, opacity: 0.25, duration: 1, stagger: 0.06 }, 0.15)
            .from(mn.querySelectorAll('.zone, .mcard, .mrow'), { y: 24, opacity: 0.25, duration: 0.9, stagger: 0.04 }, 0.3);
        });

        /* cursor label and magnetic buttons */
        if (fine) {
          D.querySelectorAll('[data-cursor]').forEach((el) => {
            if (!once(el, 'cur')) return;
            el.addEventListener('pointerenter', () => { label.textContent = el.dataset.cursor; gsap.to(label, { scale: 1, duration: 0.4, ease: 'power3.out', overwrite: true }); });
            el.addEventListener('pointerleave', () => gsap.to(label, { scale: 0, duration: 0.3, ease: 'power3.in', overwrite: true }));
          });
          D.querySelectorAll('.btn').forEach((b) => {
            if (!once(b, 'mag')) return;
            b.addEventListener('pointermove', (e) => {
              const r = b.getBoundingClientRect();
              gsap.to(b, { x: (e.clientX - r.left - r.width / 2) * 0.2, y: (e.clientY - r.top - r.height / 2) * 0.3, duration: 0.4, ease: 'power3.out' });
            });
            b.addEventListener('pointerleave', () => gsap.to(b, { x: 0, y: 0, duration: 0.7, ease: 'elastic.out(1,.4)' }));
          });
        }
        refresh();
      };
      api.scan = scan;
      scan();

      /* parts that mount later (child components, sc-if branches) */
      const ours = (n) => n.nodeType !== 1 || n.classList.contains('w') || n.classList.contains('wm') || n === cursor || n.tagName === 'SCRIPT' || (n.parentElement && n.parentElement.closest('[data-motion="marquee-velocity"]'));
      let mo = null;
      new MutationObserver((recs) => {
        if (recs.every((r) => [...r.addedNodes, ...r.removedNodes].every(ours))) return;
        clearTimeout(mo); mo = setTimeout(scan, 150);
      }).observe(D.body, { childList: true, subtree: true });
      /* layout changes that are not resizes (FAQ opening, form results) */
      if ('ResizeObserver' in W) {
        let lastH = D.body.offsetHeight;
        new ResizeObserver(() => { const h = D.body.offsetHeight; if (Math.abs(h - lastH) > 2) { lastH = h; refresh(); } }).observe(D.body);
      }
      if (D.fonts && D.fonts.ready) D.fonts.ready.then(refresh);
      W.addEventListener('load', refresh);
    };
  }
}
</script>
